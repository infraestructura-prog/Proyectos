<!doctype html>
<html lang="es">

<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<div class="app">

  <div id="sb-overlay" class="sb-overlay" hidden></div>
  <div class="main-col" id="main-col">
    <header class="topbar">
      <button type="button" id="menu-btn" class="icon-btn menu-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú">

        <label class="sr-only" for="q">Buscar macroobjetivos, proyectos o actividades</label>

          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sr-list">

      </div>
      <span class="proto-badge" title="Nueva versión del dashboard de Infraestructura">Beta</span>
    </header>
    <main id="contenido" class="contenido" tabindex="-1"></main>
  </div>
</div>
<dialog id="dlg" class="dlg" aria-labelledby="dlg-titulo"></dialog>
<dialog id="dlg2" class="dlg dlg-sm" aria-labelledby="dlg2-titulo"></dialog>
