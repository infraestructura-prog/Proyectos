<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluación de Recubrimientos – Nodo</title>
<style>
:root{
  --bg:#f4f7fa; --surface:#ffffff; --ink:#2b3a4a; --muted:#7a8896; --line:#e3e9ef;
  --blue:#dbeafe; --blue-ink:#2c5282; --accent:#6ea8dc;
  --mint:#e3f6ee; --mint-ink:#2f7d5c; --mint-line:#a9dcc4;
  --warn:#fdf1dc; --warn-ink:#8a5a12; --danger:#fde4e4; --danger-ink:#a33a3a;
  --radius:14px; --shadow:0 6px 20px rgba(60,90,120,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:linear-gradient(135deg,#e6f0fa,#e8f7f0);border-bottom:1px solid var(--line);padding:22px 24px}
header h1{margin:0;font-size:1.45rem;font-weight:650}
header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
main{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.toolbar .grow{flex:1;min-width:200px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,168,220,.2)}
.btn{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:#f0f5fa}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#5a97d0}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.danger:hover{background:var(--danger);color:var(--danger-ink);border-color:#f3b9b9}
.toggle{display:inline-flex;background:#e9eff5;border-radius:10px;padding:3px}
.toggle button{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer}
.toggle button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1);color:var(--blue-ink);font-weight:600}
.count{color:var(--muted);font-size:.85rem;margin-bottom:10px}

/* chips */
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;background:var(--blue);color:var(--blue-ink)}
.chip.mint{background:var(--mint);color:var(--mint-ink)}
.chip.warn{background:var(--warn);color:var(--warn-ink)}
.badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(90deg,#c9f0de,#d9ecff);color:#1f6b4d;font-weight:650;font-size:.76rem;padding:4px 11px;border-radius:999px;border:1px solid var(--mint-line)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card.best{border:2px solid var(--mint-line);background:linear-gradient(180deg,#f3fbf7,#fff 40%);animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 6px 20px rgba(60,90,120,.08),0 0 0 0 rgba(110,200,160,.0)}50%{box-shadow:0 6px 24px rgba(60,90,120,.1),0 0 0 6px rgba(110,200,160,.18)}}
.thumb{position:relative;height:210px;background:#fff;border-bottom:1px solid var(--line);cursor:zoom-in;overflow:hidden;padding:10px}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .badge{position:absolute;top:10px;left:10px}
.card-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{margin:0;font-size:1.05rem}
.cat{color:var(--muted);font-size:.8rem}
.vital{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cost{border-radius:10px;padding:8px;text-align:center}
.cost b{display:block;font-size:1.1rem}
.cost small{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.cost.bajo,.chip.bajo{background:#dff5ea;color:#1f6b4d}.cost.medio,.chip.medio{background:#fdf1dc;color:#8a5a12}.cost.alto,.chip.alto{background:#fde4e4;color:#a33a3a}
.vital div{background:#f6f9fc;border-radius:10px;padding:8px;text-align:center}
.card.best .vital div{background:var(--mint)}
.vital b{display:block;font-size:1.1rem}
.vital small{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.04em}
details{font-size:.88rem}
summary{cursor:pointer;color:var(--blue-ink);font-weight:600}
details ul{margin:6px 0;padding-left:18px}
.pros li::marker{color:var(--mint-ink)} .cons li::marker{color:var(--danger-ink)}
.card-actions{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);margin-top:auto}

/* table */
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.9rem}
th{background:#f0f5fa;color:var(--blue-ink);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;white-space:nowrap}
tr.best td{background:#f0fbf6}
tr.best td:first-child{border-left:4px solid var(--mint-line)}
tr:hover td{background:#f8fbfe} tr.best:hover td{background:#e8f8f0}
td img{width:64px;height:52px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;display:block}
.stars{color:#e0a73a;letter-spacing:1px;white-space:nowrap}
.stars i{color:#d5dce4;font-style:normal}
.actions{white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:50px 0}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(30,45,60,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin:0 0 14px;font-size:1.2rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
label{font-size:.82rem;color:var(--muted);display:block;margin-bottom:4px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.lightbox{background:rgba(20,30,40,.88);flex-direction:column;gap:10px;cursor:zoom-out}
.lightbox img{max-width:94vw;max-height:84vh;border-radius:10px;background:#fff}
.lightbox p{color:#fff;margin:0}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Evaluación de Soluciones de Pintura y Vinilos — Ensamblaje de Nodos</h1>
  <p>Comparativa de recubrimientos solar-reflectivos (SRI, durabilidad y facilidad de aplicación).</p>
</header>

<main>
  <div class="toolbar">
    <input type="text" id="q" class="grow" placeholder="Buscar por producto, categoría o nota…">
    <select id="catFilter" style="width:auto"></select>
    <div class="toggle" role="group" aria-label="Vista">
      <button id="vTable">▤ Tabla</button>
      <button id="vCards">▦ Tarjetas</button>
    </div>
    <button class="btn primary" id="addBtn">+ Nuevo producto</button>
    <button class="btn" id="exportBtn">⬇ Exportar JSON</button>
    <button class="btn" id="importBtn">⬆ Importar JSON</button>
    <button class="btn" id="resetBtn" title="Restaurar datos iniciales">↺ Restaurar</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
  <div class="count" id="count"></div>
  <div id="view"></div>
</main>

<!-- Modal formulario -->
<div class="overlay" id="formOverlay">
  <form class="modal" id="form">
    <h2 id="formTitle">Nuevo producto a evaluar</h2>
    <div class="form-grid">
      <div><label>Categoría de solución *</label><input type="text" name="categoria" list="catList" required></div>
      <div><label>Producto comercial *</label><input type="text" name="productoComercial" required></div>
      <div><label>Puntaje SRI *</label><input type="text" name="puntajeSRI" placeholder="Ej: 75-80" required></div>
      <div><label>Durabilidad (1-5) *</label><input type="number" name="durabilidad" min="1" max="5" step="1" required></div>
      <div><label>Vida útil / clima</label><input type="text" name="vidaUtil" placeholder="Ej: 3-5 años"></div>
      <div><label>Tipo de aplicación *</label><input type="text" name="aplicacion" placeholder="Ej: Interna, 2-4 h" required></div>
      <div><label>Nivel de costo *</label><select name="nivelCosto"><option value="bajo">Bajo</option><option value="medio">Medio</option><option value="alto">Alto</option></select></div>
      <div><label>Costo estimado *</label><input type="text" name="costo" placeholder="Ej: ~$74-$94 + envío" required></div>
      <div><label>URL de imagen</label><input type="url" name="imagenUrl" placeholder="https://…"></div>
      <div class="full"><label>…o subir imagen desde tu equipo</label><input type="file" id="imgFile" accept="image/*"></div>
      <div class="full"><label>Características clave (una por línea)</label><textarea name="caracteristicasClave" rows="3"></textarea></div>
      <div><label>Pros (uno por línea)</label><textarea name="pros" rows="3"></textarea></div>
      <div><label>Contras (uno por línea)</label><textarea name="cons" rows="3"></textarea></div>
      <div class="full"><label>Notas</label><textarea name="notas" rows="2"></textarea></div>
      <div class="full"><label><input type="checkbox" name="destacado"> Marcar como opción recomendada</label></div>
    </div>
    <datalist id="catList"></datalist>
    <div class="modal-actions">
      <button type="button" class="btn" id="cancelBtn">Cancelar</button>
      <button type="submit" class="btn primary">Guardar</button>
    </div>
  </form>
</div>

<!-- Lightbox -->
<div class="overlay lightbox" id="lightbox"><img id="lbImg" alt=""><p id="lbCap"></p></div>

<script>
(function(){
const KEY = "evalRecubrimientosNodo_v1";

function placeholder(label, c1, c2){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="600" height="400" fill="url(#g)"/><text x="300" y="195" font-family="Segoe UI,Arial" font-size="30" font-weight="600" fill="#2b3a4a" text-anchor="middle">${label}</text><text x="300" y="235" font-family="Segoe UI,Arial" font-size="18" fill="#5b6b7b" text-anchor="middle">Imagen de muestra (reemplazable)</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

const SEED = [
 {id:1,categoria:"Vinilo de Fundición",productoComercial:"3M 2080 Vinyl Wrap (Gloss White)",puntajeSRI:"75-80",durabilidad:3,vidaUtil:"3-5 años (bordes pueden levantarse)",aplicacion:"Interna (DIY), 2-4 h",costo:"~$74-$94 + envío (4-5 unid.)",nivelCosto:"bajo",destacado:true,
  imagenUrl:placeholder("3M 2080 Gloss White","#d9f2e6","#d6e8fa"),
  caracteristicasClave:["Aplicación in-house rápida y predecible","Sin riesgo de escurrimientos ni piel de naranja","Menor costo total (sin taller ni mano de obra)"],
  pros:["Aplicable en 2-4 h por personal propio","Resultado uniforme y predecible","Costo más bajo"],
  cons:["Se raya con facilidad","Bordes pueden levantarse con el tiempo"],
  notas:"Conclusión de la tabla comparativa: mejor opción para NODO."},
 {id:2,categoria:"Pintura Epóxica / Poliuretano",productoComercial:"Acrolon 218 HS (control)",puntajeSRI:"75-80",durabilidad:5,vidaUtil:"~10 años",aplicacion:"Taller especializado, 24-48 h",costo:"~$395 + envío y mano de obra (8-10 unid.)",nivelCosto:"alto",destacado:false,
  imagenUrl:placeholder("Acrolon 218 HS","#dbeafe","#eef2f6"),
  caracteristicasClave:["Poliuretano acrílico de alto desempeño","Referencia de control"],
  pros:["Máxima durabilidad y resistencia al clima"],cons:["Requiere taller especializado","Costo alto","Riesgo de defectos de acabado"],notas:""},
 {id:3,categoria:"Pintura Epóxica / Poliuretano",productoComercial:"Acrolon con pigmentos fríos (cool pigments)",puntajeSRI:"100-105",durabilidad:5,vidaUtil:"~10 años",aplicacion:"Taller especializado, 24-48 h",costo:"~$397 + envío y mano de obra (8-10 unid.)",nivelCosto:"alto",destacado:false,
  imagenUrl:placeholder("Acrolon Cool Pigments","#e0ecfb","#e9f4f0"),
  caracteristicasClave:["Mayor reflectancia solar que el control","Pigmentos de baja absorción IR"],
  pros:["SRI más alto","Muy durable"],cons:["Costo alto","Aplicación en taller","Riesgo de escurrimientos / polvo"],notas:""},
 {id:4,categoria:"Pintura con aditivo",productoComercial:"Acrolon con microesferas de vidrio (glass bubbles)",puntajeSRI:"100-105",durabilidad:4,vidaUtil:"8-10 años",aplicacion:"Taller especializado, 24-48 h",costo:"~$354 + envío y mano de obra (8-10 unid.)",nivelCosto:"medio",destacado:false,
  imagenUrl:placeholder("Acrolon Glass Bubbles","#e3eefb","#f1f4e8"),
  caracteristicasClave:["Microesferas de vidrio para mayor reflectancia","Costo menor entre las pinturas"],
  pros:["SRI alto","Costo menor que otras Acrolon"],cons:["Durabilidad algo menor","Aplicación en taller","Riesgo de defectos de acabado"],notas:""}
];

let data = load();
let view = "cards";
try{ view = localStorage.getItem(KEY+"_view") || "cards"; }catch(e){}
let editingId = null;
let pendingImg = null;
let sortKey = null, sortDir = 1;

function load(){
  try{ const s = localStorage.getItem(KEY); if(s){ const d = JSON.parse(s); if(Array.isArray(d)) return d; } }catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }
  catch(e){ console.warn("No se pudo guardar en localStorage", e); }
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toList = v => Array.isArray(v) ? v : String(v||"").split("\n").map(x=>x.trim()).filter(Boolean);
const stars = n => { n = Math.max(0,Math.min(5,+n||0)); return `<span class="stars" title="${n}/5">${"★".repeat(n)}<i>${"★".repeat(5-n)}</i></span>`; };
const nivelCosto = p => { if(["bajo","medio","alto"].includes(p.nivelCosto)) return p.nivelCosto;
  const m = String(p.costo||"").match(/\d+/); const n = m?+m[0]:0; return n<150?"bajo":n<380?"medio":"alto"; };
const NIV = {bajo:"Bajo",medio:"Medio",alto:"Alto"};
const imgOf = p => p.imagenUrl || placeholder(p.productoComercial||"Sin imagen","#e6eef6","#f2f5f8");

function filtered(){
  const q = $("#q").value.trim().toLowerCase(), c = $("#catFilter").value;
  let r = data.filter(p=>{
    if(c && p.categoria!==c) return false;
    if(!q) return true;
    return [p.categoria,p.productoComercial,p.notas,p.aplicacion,toList(p.caracteristicasClave).join(" "),toList(p.pros).join(" "),toList(p.cons).join(" ")].join(" ").toLowerCase().includes(q);
  });
  if(sortKey){
    const num = k => { const m = String(k).match(/[\d.]+/g); return m ? Math.max(...m.map(Number)) : 0; };
    r.sort((a,b)=>{
      let x=a[sortKey], y=b[sortKey];
      if(sortKey==="puntajeSRI"||sortKey==="durabilidad"){ return (num(x)-num(y))*sortDir; }
      return String(x).localeCompare(String(y),"es")*sortDir;
    });
  } else r.sort((a,b)=>(b.destacado?1:0)-(a.destacado?1:0));
  return r;
}

function refreshCats(){
  const cats = [...new Set(data.map(p=>p.categoria).filter(Boolean))].sort();
  const cur = $("#catFilter").value;
  $("#catFilter").innerHTML = '<option value="">Todas las categorías</option>'+cats.map(c=>`<option ${c===cur?"selected":""}>${esc(c)}</option>`).join("");
  $("#catList").innerHTML = cats.map(c=>`<option value="${esc(c)}">`).join("");
}

function actions(p){
  return `<button class="btn sm" data-edit="${p.id}">✎ Editar</button><button class="btn sm danger" data-del="${p.id}">🗑 Eliminar</button>`;
}
function badge(){ return `<span class="badge">★ Opción Recomendada</span>`; }

function render(){
  const list = filtered();
  $("#count").textContent = `${list.length} de ${data.length} soluciones`;
  $("#vTable").classList.toggle("on", view==="table");
  $("#vCards").classList.toggle("on", view==="cards");
  const el = $("#view");
  if(!list.length){ el.innerHTML = '<div class="empty">No hay resultados para tu búsqueda.</div>'; return; }

  if(view==="cards"){
    el.innerHTML = '<div class="grid">'+list.map(p=>`
      <article class="card ${p.destacado?"best":""}">
        <div class="thumb" data-zoom="${p.id}">${p.destacado?badge():""}<img src="${esc(imgOf(p))}" alt="${esc(p.productoComercial)}" loading="lazy"></div>
        <div class="card-body">
          <div><div class="cat">${esc(p.categoria)}</div><h3>${esc(p.productoComercial)}</h3></div>
          <div class="vital">
            <div><b>${esc(p.puntajeSRI)}</b><small>SRI</small></div>
            <div><b>${stars(p.durabilidad)}</b><small>Durabilidad</small></div>
            <div class="cost ${nivelCosto(p)}"><b>${NIV[nivelCosto(p)]}</b><small>Costo</small></div>
            <div><b style="font-size:.78rem">${esc(p.aplicacion)}</b><small>Aplicación</small></div>
          </div>
          <details>
            <summary>Ver más detalles</summary>
            <p><b>Costo:</b> ${esc(p.costo)}<br><b>Vida útil:</b> ${esc(p.vidaUtil||"—")}</p>
            ${toList(p.caracteristicasClave).length?`<b>Características clave</b><ul>${toList(p.caracteristicasClave).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
            ${toList(p.pros).length?`<b>Pros</b><ul class="pros">${toList(p.pros).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
            ${toList(p.cons).length?`<b>Contras</b><ul class="cons">${toList(p.cons).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
            ${p.notas?`<p><b>Notas:</b> ${esc(p.notas)}</p>`:""}
          </details>
        </div>
        <div class="card-actions">${actions(p)}</div>
      </article>`).join("")+'</div>';
  } else {
    const th=(k,l)=>`<th data-sort="${k}">${l}${sortKey===k?(sortDir>0?" ▲":" ▼"):""}</th>`;
    el.innerHTML = `<div class="table-wrap"><table><thead><tr>
      <th>Imagen</th>${th("productoComercial","Producto")}${th("categoria","Categoría")}${th("puntajeSRI","SRI")}${th("durabilidad","Durabilidad")}${th("aplicacion","Aplicación")}
      ${th("costo","Costo")}<th>Detalles</th><th></th></tr></thead><tbody>`+
      list.map(p=>`<tr class="${p.destacado?"best":""}">
        <td><img src="${esc(imgOf(p))}" alt="" data-zoom="${p.id}"></td>
        <td><b>${esc(p.productoComercial)}</b>${p.destacado?"<br>"+badge():""}</td>
        <td><span class="chip">${esc(p.categoria)}</span></td>
        <td><b>${esc(p.puntajeSRI)}</b></td>
        <td>${stars(p.durabilidad)}<br><small style="color:var(--muted)">${esc(p.vidaUtil||"")}</small></td>
        <td>${esc(p.aplicacion)}</td>
        <td><span class="chip ${nivelCosto(p)}"><b>${NIV[nivelCosto(p)]}</b></span><br><small style="color:var(--muted)">${esc(p.costo)}</small></td>
        <td><details><summary>Ver</summary>
          ${toList(p.caracteristicasClave).map(x=>"• "+esc(x)).join("<br>")}
          ${toList(p.pros).length?"<br><b>+</b> "+toList(p.pros).map(esc).join("; "):""}
          ${toList(p.cons).length?"<br><b>−</b> "+toList(p.cons).map(esc).join("; "):""}
          ${p.notas?"<br><i>"+esc(p.notas)+"</i>":""}</details></td>
        <td class="actions">${actions(p)}</td></tr>`).join("")+"</tbody></table></div>";
  }
}

/* eventos */
$("#q").addEventListener("input", render);
$("#catFilter").addEventListener("change", render);
$("#vTable").onclick = ()=>{view="table";try{localStorage.setItem(KEY+"_view",view)}catch(e){}render()};
$("#vCards").onclick = ()=>{view="cards";try{localStorage.setItem(KEY+"_view",view)}catch(e){}render()};

$("#view").addEventListener("click", e=>{
  const t = e.target.closest("[data-edit],[data-del],[data-zoom],[data-sort]");
  if(!t) return;
  if(t.dataset.sort){ const k=t.dataset.sort; if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=1;} render(); return; }
  if(t.dataset.edit) openForm(+t.dataset.edit);
  else if(t.dataset.del){
    const p = data.find(x=>x.id==t.dataset.del);
    if(p && confirm(`¿Eliminar "${p.productoComercial}"?`)){ data = data.filter(x=>x.id!=p.id); save(); refreshCats(); render(); }
  } else if(t.dataset.zoom){
    const p = data.find(x=>x.id==t.dataset.zoom);
    $("#lbImg").src = imgOf(p); $("#lbCap").textContent = p.productoComercial; $("#lightbox").classList.add("open");
  }
});
$("#lightbox").onclick = ()=>$("#lightbox").classList.remove("open");
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ $("#lightbox").classList.remove("open"); closeForm(); } });

/* formulario */
function openForm(id){
  editingId = id ?? null; pendingImg = null;
  const f = $("#form"); f.reset();
  $("#formTitle").textContent = id ? "Editar producto" : "Nuevo producto a evaluar";
  if(id){
    const p = data.find(x=>x.id===id);
    f.elements.nivelCosto.value = nivelCosto(p);
    for(const k of ["categoria","productoComercial","puntajeSRI","durabilidad","vidaUtil","aplicacion","costo","notas"]) f.elements[k].value = p[k] ?? "";
    f.elements.imagenUrl.value = (p.imagenUrl||"").startsWith("data:") ? "" : (p.imagenUrl||"");
    f.elements.caracteristicasClave.value = toList(p.caracteristicasClave).join("\n");
    f.elements.pros.value = toList(p.pros).join("\n");
    f.elements.cons.value = toList(p.cons).join("\n");
    f.elements.destacado.checked = !!p.destacado;
    if((p.imagenUrl||"").startsWith("data:")) pendingImg = p.imagenUrl;
  }
  $("#formOverlay").classList.add("open");
}
function closeForm(){ $("#formOverlay").classList.remove("open"); }
$("#addBtn").onclick = ()=>openForm();
$("#cancelBtn").onclick = closeForm;
$("#formOverlay").addEventListener("mousedown", e=>{ if(e.target.id==="formOverlay") closeForm(); });

$("#imgFile").addEventListener("change", e=>{
  const file = e.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const s = Math.min(1, 700/Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = im.width*s; c.height = im.height*s;
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      pendingImg = c.toDataURL("image/jpeg",.8);
      $("#form").elements.imagenUrl.value = "";
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
});

$("#form").addEventListener("submit", e=>{
  e.preventDefault();
  const f = e.target.elements, v = k => f[k].value.trim();
  const url = v("imagenUrl");
  const p = {
    id: editingId ?? (data.reduce((m,x)=>Math.max(m,x.id||0),0)+1),
    categoria:v("categoria"), productoComercial:v("productoComercial"), puntajeSRI:v("puntajeSRI"),
    durabilidad:Math.max(1,Math.min(5,parseInt(v("durabilidad"))||1)), vidaUtil:v("vidaUtil"), aplicacion:v("aplicacion"), costo:v("costo"), nivelCosto:f.nivelCosto.value,
    destacado:f.destacado.checked, imagenUrl: url || pendingImg || "",
    caracteristicasClave:toList(f.caracteristicasClave.value), pros:toList(f.pros.value), cons:toList(f.cons.value), notas:v("notas")
  };
  if(!p.imagenUrl) p.imagenUrl = placeholder(p.productoComercial,"#e6eef6","#e9f6ef");
  if(editingId){ data = data.map(x=>x.id===editingId?p:x); } else data.push(p);
  save(); refreshCats(); render(); closeForm();
});

/* import / export / reset */
$("#exportBtn").onclick = ()=>{
  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "evaluacion-recubrimientos-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$("#importBtn").onclick = ()=>$("#importFile").click();
$("#importFile").addEventListener("change", e=>{
  const file = e.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const d = JSON.parse(rd.result);
      if(!Array.isArray(d) || d.some(x=>!x || typeof x!=="object" || !x.productoComercial)) throw 0;
      if(!confirm(`Se reemplazarán los datos actuales por ${d.length} productos. ¿Continuar?`)) return;
      data = d.map((x,i)=>({...x, id:x.id ?? i+1}));
      save(); refreshCats(); render();
    }catch(err){ alert("JSON inválido: se espera un arreglo de productos con 'productoComercial'."); }
  };
  rd.readAsText(file); e.target.value="";
});
$("#resetBtn").onclick = ()=>{
  if(confirm("¿Restaurar los datos iniciales? Se perderán tus cambios.")){ data = JSON.parse(JSON.stringify(SEED)); save(); refreshCats(); render(); }
};

refreshCats(); render();
})();
</script>
</body>
</html>
